name: Release

# Push a tag like v0.2.0 (after bumping both package.json versions) to publish
# @pixremove/sdk and pixremove to npm. Auth is npm Trusted Publishing (OIDC):
# no token is stored here, and each version gets a provenance attestation.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm build && pnpm typecheck && pnpm test
      - name: Check tag matches package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in packages/sdk packages/cli; do
            v=$(node -p "require('./$p/package.json').version")
            [ "$v" = "$tag" ] || { echo "$p is $v, tag is $tag"; exit 1; }
          done
      # pnpm pack swaps workspace:^ for the real version; npm publish does
      # the OIDC exchange. The SDK goes first because the CLI depends on it.
      - name: Publish
        run: |
          mkdir -p .packs
          for p in packages/sdk packages/cli; do
            (cd "$p" && pnpm pack --pack-destination ../../.packs)
          done
          npm publish .packs/pixremove-sdk-*.tgz --access public
          npm publish .packs/pixremove-cli-*.tgz --access public
